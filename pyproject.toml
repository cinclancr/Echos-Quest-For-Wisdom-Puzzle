[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echoquest"
version = "1.1.0"
description = "Reproducible research toolkit investigating the Echo's Quest For Wisdom Bitcoin steganography puzzle (read-only)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "cinclancr"}]
keywords = [
    "bitcoin",
    "steganography",
    "bip39",
    "cryptanalysis",
    "word-puzzle",
    "reproducible-research",
    "electrum",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
echoquest = "echoquest.cli:main"

[project.urls]
Homepage = "https://github.com/cinclancr/Echos-Quest-For-Wisdom-Puzzle"
Issues = "https://github.com/cinclancr/Echos-Quest-For-Wisdom-Puzzle/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
